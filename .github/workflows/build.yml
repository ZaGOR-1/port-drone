name: DroneFlames CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Reserved compatibility flag; this workflow never publishes
        type: boolean
        default: false
      release_version:
        description: Reserved compatibility input; does not enable publishing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  BUILD_VERSION: 0.34.0
  UPDATE_REPO: ''
  DF_NO_UPDATE: '1'
  DF_STEAM_MOCK: '0'
  DF_NO_OPENING: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    name: Python and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python tests (Godot fixtures run in the build job)
        run: |
          mkdir -p dist/ci
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee dist/ci/python.log
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ github.sha }}
          path: dist/ci/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Godot regressions and Windows x64 build
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release: ${{ steps.policy.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Disable publication on every event
        id: policy
        run: echo 'release=false' >> "$GITHUB_OUTPUT"
      - name: Fetch pinned editor and Windows template
        run: python3 tools/fetch_godot.py godot_dl
      - name: Verify engine hashes and actual version
        run: python3 tools/ci/verify_build.py --godot-dir godot_dl --out dist/ci/engine.json
      - name: Python tests with actual Godot and isolated fixture users
        env:
          DF_GODOT: ${{ github.workspace }}/godot_dl/godot
          DF_TEST_LOG_DIR: ${{ github.workspace }}/dist/ci/fixtures
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee dist/ci/godot-tests.log
      - name: Simulation regression (not a performance benchmark)
        run: python3 tools/check_performance.py --godot godot_dl/godot --mode regression --out dist/ci/regression
      - name: Build Windows x64 with updater source disabled
        run: |
          python3 tools/build.py --godot godot_dl/godot \
            --template godot_dl/windows_release_x86_64.exe \
            --version "$BUILD_VERSION" --repo "$UPDATE_REPO" --out dist/ci/windows-x64
          cp libs/*.dll tools/qa/Run-*.ps1 dist/ci/windows-x64/
      - name: Verify package and record provenance
        run: |
          python3 tools/ci/verify_build.py --godot-dir godot_dl \
            --package dist/ci/windows-x64 --out dist/ci/build-verification.json
          cd dist/ci/windows-x64
          sha256sum -c SHA256SUMS.txt
          sha256sum -c QA-SHA256SUMS.txt
      - name: Upload verified QA package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DroneFlames-windows-x64-${{ github.sha }}
          path: dist/ci/windows-x64/
          retention-days: 7
          if-no-files-found: error
      - name: Retain diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            dist/ci/*.json
            dist/ci/*.log
            dist/ci/fixtures/
            dist/ci/regression/
          retention-days: 7
          if-no-files-found: warn

  # Compatibility with existing publication-policy tests only. The build output
  # above is always false; no publishing command or token is passed to any step.
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true && inputs.release_version != '' && needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse publication even if the reserved gate is changed
        run: |
          echo 'Release publishing is not implemented by this CI workflow.'
          exit 1
